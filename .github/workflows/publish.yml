name: Publish snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never let two deploys of the same snapshot run concurrently.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and deploy to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Refuse to deploy a non-SNAPSHOT version
        run: |
          PROJECT_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "project.version=$PROJECT_VERSION"
          case "$PROJECT_VERSION" in
            *-SNAPSHOT) ;;
            *) echo "::error::$PROJECT_VERSION is not a SNAPSHOT - releases do not come from main."; exit 1 ;;
          esac

      # Tests run here too: the merge result is not what any PR head tested.
      # One reactor pass publishes all four artifacts (parent, api, atom-feed, omod).
      # deployAtEnd: without it, a failure part-way through leaves a partial publish.
      #
      # Snapshot retention: GitHub Packages keeps every timestamped build under the single
      # -SNAPSHOT version entry and offers no way to prune them (deleting the version would
      # remove the artifact entirely), so growth is accepted deliberately.
      - name: Deploy snapshot
        run: ./mvnw -B --no-transfer-progress -s .github/maven-settings.xml -DdeployAtEnd=true clean deploy -DskipITs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
